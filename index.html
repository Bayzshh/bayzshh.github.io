<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Saya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }

        /* Layar Loading */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            color: white;
            margin-top: 20px;
            font-size: 18px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Konten Utama */
        .content {
            display: none;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            text-align: center;
        }
        .foto-profil {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 3px solid white;
        }
        h1 {
            color: white;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .bio {
            color: #e9d5ff;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .link-item {
            background: white;
            color: #6b21a8;
            text-decoration: none;
            display: block;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-weight: bold;
            transition: 0.3s;
        }
        .link-item:hover {
            transform: scale(1.03);
            background: #f3e8ff;
        }
    </style>
</head>
<body>

    <!-- Layar Loading -->
    <div class="loading-screen" id="loading">
        <div class="loading-spinner"></div>
        <p class="loading-text">Sedang memuat...</p>
    </div>

    <!-- Konten Halaman -->
    <div class="content" id="content">
        <div class="container">
            <div class="foto-profil">✨</div>
            <h1>Bayzshh</h1>
            <p class="bio">Selamat datang di link saya ✨</p>

            <a href="https://www.instagram.com/bayz_00p?srtk=OTFtN2h2dzhxNjZ6" target="_blank" class="link-item">📸 Instagram</a>
            <a href="https://wa.me/6285151265729" target="_blank" class="link-item">💬 WhatsApp</a>
            <a href="https://www.tiktok.com/@yorzsh?_r=1&_t=ZS-9AmdPgEy6uC" target="_blank" class="link-item">🎵 TikTok</a>
            <a href="https://vt.tokopedia.com/t/ZS9U3Y5KRa53K-8wqJ0/" target="_blank" class="link-item">🛒 Produk Saya</a>
        </div>
    </div>

    <!-- Script untuk Sembunyikan Loading -->
    <script>
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                }, 500);
            }, 1500);
        };
    </script>

</body>
</html>
